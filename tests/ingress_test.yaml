suite: ingress
templates:
  - ingress.yaml
tests:
  - it: should not create ingress when disabled
    set:
      ingress.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create ingress when enabled
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: ha.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: RELEASE-NAME-home-assistant

  - it: should set ingress class name
    set:
      ingress.enabled: true
      ingress.className: nginx
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: should configure TLS when provided
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: ha.example.com
          paths:
            - path: /
              pathType: Prefix
      ingress.tls:
        - secretName: ha-tls
          hosts:
            - ha.example.com
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: ha-tls
      - contains:
          path: spec.tls[0].hosts
          content: ha.example.com

  - it: should set annotations
    set:
      ingress.enabled: true
      ingress.annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-body-size"]
          value: "50m"