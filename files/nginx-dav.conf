error_log /var/log/nginx/error.log debug;

server {
    listen 8080;
    server_name _;

    # WebDAV root - Home Assistant config directory
    root /config;

    # Client max body size for uploads
    client_max_body_size 1G;
    client_body_temp_path /tmp;

    # Create directories for uploads if they don't exist
    create_full_put_path on;

    # Enable DAV methods
    dav_methods PUT DELETE MKCOL COPY MOVE;
    dav_ext_methods PROPFIND OPTIONS;

    # DAV access permissions
    dav_access user:rw group:rw all:r;

    location / {
        # Authentication subrequest
        auth_request /auth;
        auth_request_set $auth_status $upstream_status;

        # Pass the Authorization header to the auth subrequest
        proxy_set_header Authorization $http_authorization;

        # WebDAV configuration
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # CORS headers for WebDAV clients
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PROPFIND, PROPPATCH, MKCOL, COPY, MOVE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Depth, User-Agent, X-File-Size, X-Requested-With, If-Modified-Since, X-File-Name, Cache-Control' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Handle OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PROPFIND, PROPPATCH, MKCOL, COPY, MOVE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Depth, User-Agent, X-File-Size, X-Requested-With, If-Modified-Since, X-File-Name, Cache-Control';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Internal location for auth subrequest
    location = /auth {
        internal;

        # Extract Bearer token from Authorization header and pass it to Home Assistant
        proxy_pass http://localhost:8123/api/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;

        # Pass the Authorization header as-is
        proxy_set_header Authorization $http_authorization;

        # Set timeout for auth request
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Specific handling for some file extensions
    location ~ \.(db|db-shm|db-wal)$ {
        deny all;
        return 404;
    }
}