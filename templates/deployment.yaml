{{- $db_host := default (printf "%s-postgresql" .Release.Name) .Values.externalPostgres.host -}}
{{- $db_port := default "5432" .Values.externalPostgres.port -}}
{{- $db_user := default "postgres" .Values.externalPostgres.username -}}
{{- $db_secret_name := default (printf "%s-postgresql" .Release.Name) .Values.externalPostgres.passwordFromSecretKeyRef.name -}}
{{- $db_secret_key := default "postgres-password" .Values.externalPostgres.passwordFromSecretKeyRef.key -}}
{{/*
The recorder db_url is `!env_var HA_DB_URL`, so the password never lands in the
generated configuration.yaml, logs or args. DB_PASSWORD must precede HA_DB_URL:
Kubernetes expands $(VAR) only from variables defined earlier in the list.
*/}}
{{- $dbEnv := list
      (dict "name" "DB_PASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" $db_secret_name "key" $db_secret_key)))
      (dict "name" "HA_DB_URL" "value" (printf "postgresql://%s:$(DB_PASSWORD)@%s:%v/%s" $db_user $db_host $db_port .Values.database.name)) -}}
{{/*
Build a single, merged `homeassistant:` map for the generated configuration.yaml.
Consumers may pass `haconfig.homeassistant`; `externalUrl` and `packages` merge
into that same map so exactly one `homeassistant:` block is emitted.
*/}}
{{- $ha := dict -}}
{{- with .Values.haconfig -}}
  {{- with .homeassistant -}}
    {{- $ha = deepCopy . -}}
  {{- end -}}
{{- end -}}
{{- if .Values.externalUrl -}}
  {{- $_ := set $ha "external_url" .Values.externalUrl -}}
{{- end -}}
{{- if and .Values.packages .Values.packages.enabled -}}
  {{- $_ := unset $ha "packages" -}}
{{- end -}}
{{- $haRest := omit (.Values.haconfig | default dict) "homeassistant" -}}
{{- $emitHa := or (gt (len $ha) 0) (and .Values.packages .Values.packages.enabled) -}}
{{/* Build the lovelace map (YAML-mode dashboards alongside the storage dashboard). */}}
{{- $lovelace := dict -}}
{{- if and .Values.lovelace .Values.lovelace.enabled -}}
  {{- $_ := set $lovelace "mode" (default "storage" .Values.lovelace.mode) -}}
  {{- $dashboards := dict -}}
  {{- range .Values.lovelace.dashboards -}}
    {{- $d := dict "mode" (default "yaml" .mode) "filename" .filename "title" .title -}}
    {{- if hasKey . "icon" -}}{{- $_ := set $d "icon" .icon -}}{{- end -}}
    {{- if hasKey . "showInSidebar" -}}{{- $_ := set $d "show_in_sidebar" .showInSidebar -}}{{- end -}}
    {{- if hasKey . "requireAdmin" -}}{{- $_ := set $d "require_admin" .requireAdmin -}}{{- end -}}
    {{- $_ := set $dashboards .urlPath $d -}}
  {{- end -}}
  {{- $_ := set $lovelace "dashboards" $dashboards -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "home-assistant.fullname" . }}
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "home-assistant.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "home-assistant.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.dbClientImage.repository }}:{{ .Values.dbClientImage.tag }}"
          imagePullPolicy: {{ .Values.dbClientImage.pullPolicy }}
          command:
            - 'sh'
            - '-e'
            - '-c'
            - 'until pg_isready -U {{ $db_user }} -h {{ $db_host }} -p {{ $db_port }}; do sleep 1; done'
        - name: create-ha-db-if-missing
          image: "{{ .Values.dbClientImage.repository }}:{{ .Values.dbClientImage.tag }}"
          imagePullPolicy: {{ .Values.dbClientImage.pullPolicy }}
          command:
          - 'sh'
          - '-e'
          - '-c'
          - |
              psql -U {{ $db_user }} -h {{ $db_host }} -p {{ $db_port }} -tc "SELECT 1 FROM pg_database WHERE datname = '{{ .Values.database.name }}'" | grep -q 1 || psql -U {{ $db_user }} -h {{ $db_host }} -p {{ $db_port }} -c "CREATE DATABASE {{ .Values.database.name }}"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db_secret_name }}
                  key: {{ $db_secret_key }}
        {{- if .Values.configGeneration.enabled }}
        - name: generate-config
          image: docker.io/busybox:1
          command:
            - 'sh'
            - '-c'
            - |
              echo '
              default_config:

              # Load frontend themes from the themes folder
              frontend:
                themes: !include_dir_merge_named themes

              automation: !include automations.yaml
              script: !include scripts.yaml
              scene: !include scenes.yaml

              {{- if $emitHa }}
              homeassistant:
              {{- if gt (len $ha) 0 }}
              {{- toYaml $ha | nindent 16 }}
              {{- end }}
              {{- if and .Values.packages .Values.packages.enabled }}
                packages: !include_dir_named packages/
              {{- end }}
              {{- end }}
              {{- if gt (len $lovelace) 0 }}
              lovelace:
              {{- toYaml $lovelace | nindent 16 }}
              {{- end }}
              {{- toYaml $haRest | nindent 14 }}

              # Required DB Section
              recorder:
                purge_keep_days: {{ .Values.database.purgeKeepDays }}
                db_url: !env_var HA_DB_URL
                exclude:
                  {{- toYaml .Values.database.exclude | nindent 18 }}
              ' > /config/configuration.yaml
          volumeMounts:
            - mountPath: /config
              name: config
        {{- end }}
        - name: bootstrap-configs-if-needed
          image: docker.io/busybox:1
          command:
            - 'sh'
            - '-c'
            - |
              if [ ! -f /config/automations.yaml ]
              then
                  echo "Creating first time configs"
                  echo "[]" > /config/automations.yaml
                  touch /config/scripts.yaml
                  touch /config/scenes.yaml
              fi
          volumeMounts:
            - mountPath: /config
              name: persist-configs
      {{- if .Values.components.enabled }}
        - name: install-components
          image: "{{ .Values.components.image.repository }}:{{ .Values.components.image.tag }}"
          imagePullPolicy: {{ .Values.components.image.pullPolicy }}
          command:
            - 'sh'
            - '-c'
            - |
              set -eu
              install_integration() {  # name repo version
                marker="/config/custom_components/$1/.pinned-version"
                if [ -f "$marker" ] && [ "$(cat "$marker")" = "$3" ]; then echo "$1 $3 present"; return; fi
                tmp=$(mktemp -d)
                wget -qO "$tmp/src.tgz" "https://github.com/$2/archive/refs/tags/$3.tar.gz"
                tar -xzf "$tmp/src.tgz" -C "$tmp"
                src=$(find "$tmp" -maxdepth 3 -type d -path "*/custom_components/$1" | head -n1)
                [ -n "$src" ] || { echo "no custom_components/$1 in $2@$3" >&2; exit 1; }
                mkdir -p /config/custom_components && rm -rf "/config/custom_components/$1"
                cp -r "$src" "/config/custom_components/$1" && echo "$3" > "$marker" && rm -rf "$tmp"
                echo "installed $1 $3"
              }
              install_card() {  # name url-with-{version} version
                dir="/config/www/community/$1"; marker="$dir/.pinned-version"
                if [ -f "$marker" ] && [ "$(cat "$marker")" = "$3" ]; then echo "$1 $3 present"; return; fi
                # Empty the dir: aiohttp serves a <file>.gz/.br sibling in preference to
                # <file>, so a stale precompressed copy (HACS writes them) would shadow it.
                url=$(echo "$2" | sed "s/{version}/$3/g"); rm -rf "$dir" && mkdir -p "$dir"
                wget -qO "$dir/$(basename "$url")" "$url" && echo "$3" > "$marker"
                echo "installed $1 $3"
              }
              {{- range .Values.components.integrations }}
              install_integration {{ .name | quote }} {{ .repo | quote }} {{ .version | quote }}
              {{- end }}
              {{- range .Values.components.cards }}
              install_card {{ .name | quote }} {{ .url | quote }} {{ .version | quote }}
              {{- end }}
              {{- range .Values.components.remove }}
              rm -rf "/config/custom_components/{{ . }}" && echo "removed {{ . }}"
              {{- end }}
          volumeMounts:
            - mountPath: /config
              name: persist-configs
      {{- end }}
      {{- if .Values.hacs }}
        - name: bootstrap-hacs-if-needed
          image: docker.io/alpine:3.20
          command:
            - 'sh'
            - '-c'
            - |
              if [ ! -f /config/custom_components/hacs/__init__.py ]
              then
                  apk update
                  apk add bash
                  cd /config
                  wget -O - https://get.hacs.xyz | bash -
              fi
          volumeMounts:
            - mountPath: /config
              name: persist-configs
      {{- end }}
      {{- if and .Values.checkConfig .Values.checkConfig.enabled }}
        - name: check-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - 'python'
            - '-m'
            - 'homeassistant'
            - '--script'
            - 'check_config'
            - '-c'
            - '/config'
          env:
            {{- toYaml $dbEnv | nindent 12 }}
          volumeMounts:
            - mountPath: /config
              name: persist-configs
            {{- if .Values.configGeneration.enabled }}
            - mountPath: /config/configuration.yaml
              name: config
              subPath: configuration.yaml
            {{- end }}
            {{- with .Values.extraConfigMounts }}
            {{- include "home-assistant.extraConfigVolumeMounts" . | trimPrefix "\n" | nindent 12 }}
            {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- toYaml $dbEnv | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /config
              name: persist-configs
            {{- if .Values.configGeneration.enabled }}
            - mountPath: /config/configuration.yaml
              name: config
              subPath: configuration.yaml
            {{- end }}
            {{- with .Values.extraConfigMounts }}
            {{- include "home-assistant.extraConfigVolumeMounts" . | trimPrefix "\n" | nindent 12 }}
            {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.dav.enabled }}
        - name: nginx-dav
          image: "{{ .Values.dav.nginxImage.repository }}:{{ .Values.dav.nginxImage.tag }}"
          imagePullPolicy: {{ .Values.dav.nginxImage.pullPolicy }}
          ports:
            - name: dav
              containerPort: {{ .Values.dav.port }}
              protocol: TCP
          volumeMounts:
            - mountPath: /config
              name: persist-configs
            - mountPath: /etc/nginx/conf.d/default.conf
              name: nginx-config
              subPath: nginx.conf
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
            requests:
              memory: "128Mi"
              cpu: "100m"
        {{- end }}
      volumes:
        {{- if .Values.configGeneration.enabled }}
        - name: config
          emptyDir:
            medium: Memory
        {{- end }}
        - name: persist-configs
          persistentVolumeClaim:
            claimName: {{ include "home-assistant.name" . }}-persist
        {{- if .Values.dav.enabled }}
        - name: nginx-config
          configMap:
            name: {{ include "home-assistant.fullname" . }}-nginx-config
        {{- end }}
        {{- with .Values.extraConfigMounts }}
        {{- include "home-assistant.extraConfigVolumes" . | trimPrefix "\n" | nindent 8 }}
        {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
