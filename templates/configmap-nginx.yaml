{{- if .Values.dav.enabled -}}
{{- /* indent pads blank lines with spaces; strip that trailing whitespace so the rendered ConfigMap is yamllint-clean */ -}}
{{- $nginxConf := .Files.Get "files/nginx-dav.conf" | indent 4 -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "home-assistant.fullname" . }}-nginx-config
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
data:
  nginx.conf: |
{{ regexReplaceAll "(?m) +$" $nginxConf "" }}
{{- end }}